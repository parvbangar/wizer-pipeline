name: Layer 2 — Story clustering

# Fallback for the in-memory clusterer. process.yml clusters after every
# ingest run; this schedule makes sure nothing waits long if those runs were
# superseded or failed. Same job, same single-writer group, same cached state:
# it clusters EVERY article still without a cluster (titles + descriptions from
# the database — no hand-off needed), oldest ingested first.
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours of ingestion"
        required: false
        default: "72"

concurrency:
  group: story-clustering
  cancel-in-progress: false

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CLUSTERING_ENABLED:   ${{ vars.CLUSTERING_ENABLED || 'true' }}
      HF_HOME:              /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cluster.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-e5base-v1
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-cluster.txt
      - name: Restore cluster state
        uses: actions/cache/restore@v4
        with:
          path: state/cluster_state.npz
          key: cluster-state-${{ github.run_id }}
          restore-keys: cluster-state-
      - name: Cluster in memory
        if: env.CLUSTERING_ENABLED != 'false'
        # Stop cleanly at 50 min (job timeout 60); the next run continues.
        run: python cluster.py run --memory --state state/cluster_state.npz --hours ${{ github.event.inputs.hours || '72' }} --time-budget 50
      - name: Save cluster state
        if: success() && env.CLUSTERING_ENABLED != 'false'
        uses: actions/cache/save@v4
        with:
          path: state/cluster_state.npz
          key: cluster-state-${{ github.run_id }}-${{ github.run_attempt }}
