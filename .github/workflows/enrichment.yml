name: Layer 2 — Metadata Enrichment

# THE SWEEPER. Fresh articles are enriched by process.yml straight from the
# ingest hand-off (with their body). This job is the backstop that guarantees
# every article is enriched: every 2 hours 4 runners claim, oldest first, articles
# ingested more than ENRICH_SWEEP_MIN_AGE_HOURS ago that are still unenriched
# — a hand-off shard that ran out of time, a failed save, a lost artifact, a
# dead letter due its daily retry — and enriches them from title + description
# (the body is not stored in Postgres). See docs/enrichment_queue_v2_migration.sql.
#
# Claims use FOR UPDATE SKIP LOCKED, so the 4 runners (and an overlapping
# manual run) never process the same article. Capacity ~4 x 3,000 every 2 h:
# enough to drain the overflow of a first poll after a reset within a day.
on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles per runner (default: 3000)"
        required: false
        default: "3000"
      force:
        description: "Re-enrich already-enriched articles? (true/false)"
        required: false
        default: "false"

jobs:
  enrich:
    name: "Sweeper ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 135   # setup ~15 min + 100-min budget + final save; < 150-min claim lease
    # At most one running + one queued job per runner slot. Seven triggers can
    # fire within the same hour; without this, a backlog of identical jobs
    # would pile up and burn Actions minutes claiming an already-drained queue.
    concurrency:
      group: enrich-sweeper-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2, 3]
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
      ENRICH_BATCH_SIZE:          ${{ github.event.inputs.batch_size || '3000' }}
      ENRICH_RUNNER_NAME:         sweeper-${{ matrix.runner }}
      # Leave fresh articles to the hand-off runners (process.yml).
      ENRICH_SWEEP_MIN_AGE_HOURS: "6"
      # Stop starting new articles at 100 min and release the rest, leaving
      # 20 min of the 120-min timeout for the in-flight article + bookkeeping.
      ENRICH_TIME_BUDGET_MINUTES: "100"
      # The claim lease must outlive the job timeout (see enrichment/config.py).
      ENRICH_CLAIM_LEASE_MINUTES: "150"
      # Clustering belongs to the single writer (process.yml / cluster.yml,
      # group story-clustering); a second writer here could lose an update to
      # the in-memory state. Unclustered articles are on that job's work list.
      CLUSTERING_ENABLED:         "false"
      HF_HOME:                    /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          # Bump the suffix whenever the model set changes.
          key: hf-models-deberta-sentiment-e5base-v4
          restore-keys: hf-models-deberta-sentiment-
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_md
          python -m spacy download xx_ent_wiki_sm
      - name: Pre-download ML models
        run: |
          python -c "
          from transformers import pipeline
          from sentence_transformers import SentenceTransformer
          from enrichment.config import CLUSTER_EMBEDDING_MODEL
          print('Downloading mDeBERTa (~560 MB)...')
          pipeline('zero-shot-classification', model='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli', device=-1)
          print('Downloading multilingual sentiment (~268 MB)...')
          pipeline('text-classification', model='lxyuan/distilbert-base-multilingual-cased-sentiments-student', device=-1)
          print(f'Downloading clustering embeddings {CLUSTER_EMBEDDING_MODEL} (~1.1 GB)...')
          SentenceTransformer(CLUSTER_EMBEDDING_MODEL, device='cpu')
          print('All models ready.')
          "
      - name: Run enrichment pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ -n "$FORCE_FLAG" ]; then
            python enrich.py --batch-size $ENRICH_BATCH_SIZE $FORCE_FLAG
          else
            python enrich.py --sweep --batch-size $ENRICH_BATCH_SIZE
          fi
