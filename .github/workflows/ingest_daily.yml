name: Ingest — daily + unknown (every 12 hours)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll daily feeds
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_CONCURRENT_FEEDS:   "10"
          MAX_CONCURRENT_ARTICLES: "5"
        run: python main.py --cadence daily

      - name: Poll unknown-cadence feeds
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_CONCURRENT_FEEDS:   "10"
          MAX_CONCURRENT_ARTICLES: "5"
        run: python main.py --cadence unknown
