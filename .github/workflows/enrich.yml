name: Layer 2 — Metadata Enrichment

# ─────────────────────────────────────────────────────────────────────────────
# WHEN DOES THIS RUN?
#   Every hour at :30 past the hour (offset from ingestion at :00).
#   Schedule: 0:30, 1:30, 2:30 ... UTC  (6:00, 7:00, 8:00 ... IST)
#
# PARALLEL SHARDS:
#   Two jobs run simultaneously per trigger — shard 0 and shard 1.
#   Shard 0 enriches the newest 2,000 articles (offset 0).
#   Shard 1 enriches the next   2,000 articles (offset 2,000).
#   Zero overlap, 4,000 articles enriched per hour trigger.
#
# DAILY THROUGHPUT:
#   24 runs × 4,000 articles = ~96,000 articles/day
#
# MODELS USED (downloaded once, cached between runs):
#   mDeBERTa-v3-base-mnli-xnli  (~560 MB) — zero-shot category classification
#   sentence-transformers/LaBSE (~471 MB) — multilingual story clustering
#   en_core_web_sm + xx_ent_wiki_sm       — NER for entity tagging
#
# COST: $0 — GitHub Actions is FREE for public repositories.
#
# RUNNER SPEC: ubuntu-latest = 2 vCPU, 7 GB RAM, 14 GB disk
#   Estimated time per 2,000-article batch:
#     Model loading (cached):    ~2 min
#     NER (spaCy):               ~0.5s/article
#     Classification (mDeBERTa): ~0.2s/article
#     Embedding (LaBSE):         ~0.1s/article
#     Total per shard:           ~30-50 min
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "30 * * * *"    # every hour at :30
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles per shard (default: 2000)"
        required: false
        default: "2000"
      force:
        description: "Re-enrich already-enriched articles? (true/false)"
        required: false
        default: "false"

jobs:
  enrich:
    name: "Enrich shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120   # model loading + 2,000 articles with NLP

    strategy:
      fail-fast: false      # if one shard fails, let the other keep running
      matrix:
        include:
          - shard: 0
            offset: 0
          - shard: 1
            offset: 2000

    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ENRICH_BATCH_SIZE:    ${{ github.event.inputs.batch_size || '2000' }}
      # Shard 0 → offset 0, Shard 1 → offset 2000 (explicit, no arithmetic)
      ENRICH_OFFSET:        ${{ matrix.offset }}
      # Tell HuggingFace where to cache models (matches our cache step below)
      HF_HOME:              /home/runner/.cache/huggingface

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── Cache ML models ──────────────────────────────────────────────────────
      # mDeBERTa + LaBSE total ~1 GB. Caching saves ~10 min per run.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-models-deberta-labse-v1
          restore-keys: hf-models-deberta-labse-

      # ── Install PyTorch CPU-only BEFORE requirements.txt ─────────────────────
      # torch CPU wheel = ~200 MB vs ~2 GB for the default CUDA wheel.
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Download spaCy models (cached via pip cache) ─────────────────────────
      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download xx_ent_wiki_sm

      # ── Pre-download HuggingFace models (populates cache on first run) ────────
      # On cache hit this is instant. On first run it downloads ~1 GB once.
      - name: Pre-download ML models
        run: |
          python -c "
          from transformers import pipeline
          from sentence_transformers import SentenceTransformer
          print('Downloading mDeBERTa...')
          pipeline('zero-shot-classification', model='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli', device=-1)
          print('Downloading LaBSE...')
          SentenceTransformer('sentence-transformers/LaBSE')
          print('Models ready.')
          "

      - name: Run enrichment pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python enrich.py --batch-size $ENRICH_BATCH_SIZE --offset $ENRICH_OFFSET $FORCE_FLAG
