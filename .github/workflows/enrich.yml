name: Layer 2 — Metadata Enrichment

# Runs every hour at :30, offset from ingestion at :00.
# Two parallel shards: shard 0 = articles 0-499, shard 1 = articles 500-999.
# 1,000 articles enriched per trigger × 24 triggers = ~24,000 articles/day.
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles per shard (default: 500)"
        required: false
        default: "500"
      force:
        description: "Re-enrich already-enriched articles? (true/false)"
        required: false
        default: "false"

jobs:
  enrich:
    name: "Enrich shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            offset: 0
          - shard: 1
            offset: 500

    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ENRICH_BATCH_SIZE:    ${{ github.event.inputs.batch_size || '500' }}
      ENRICH_OFFSET:        ${{ matrix.offset }}
      HF_HOME:              /home/runner/.cache/huggingface

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-models-deberta-labse-sentiment-v2
          restore-keys: hf-models-deberta-labse-

      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_sm
          python -m spacy download xx_ent_wiki_sm

      # Pre-download HuggingFace models into cache.
      # On cache hit this is instant. On first run downloads ~1.3 GB once.
      - name: Pre-download ML models
        run: |
          python -c "
          from transformers import pipeline
          from sentence_transformers import SentenceTransformer
          print('Downloading mDeBERTa (~560 MB)...')
          pipeline('zero-shot-classification', model='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli', device=-1)
          print('Downloading LaBSE (~471 MB)...')
          SentenceTransformer('sentence-transformers/LaBSE')
          print('Downloading multilingual sentiment (~268 MB)...')
          pipeline('text-classification', model='lxyuan/distilbert-base-multilingual-cased-sentiments-student', device=-1)
          print('All models ready.')
          "

      - name: Run enrichment pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python enrich.py --batch-size $ENRICH_BATCH_SIZE --offset $ENRICH_OFFSET $FORCE_FLAG
