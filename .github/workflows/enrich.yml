name: Layer 2 — Metadata Enrichment

# PRIMARY TRIGGER: workflow_run
#   Fires within ~1 minute of any ingestion job completing.
#   This is the "hand in hand" mechanism — newly ingested articles are
#   enriched almost immediately rather than waiting up to 30-90 minutes.
#
# FALLBACK TRIGGER: hourly schedule
#   Catches any articles that slipped through (e.g. the ingestion job
#   finished while enrichment was already running, or network blips).
#
# Two parallel shards: shard 0 = articles 0-999, shard 1 = articles 1000-1999.
# 2,000 articles enriched per trigger × triggers-per-day = max throughput.
on:
  workflow_run:
    workflows:
      - "Ingest — breaking_news (every 1 hour)"
      - "Ingest — multiple_daily"
      - "Ingest — daily"
      - "Ingest — weekly"
      - "Ingest — several_weekly"
      - "Ingest — monthly"
    types: [completed]
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles per shard (default: 1000)"
        required: false
        default: "1000"
      force:
        description: "Re-enrich already-enriched articles? (true/false)"
        required: false
        default: "false"

jobs:
  enrich:
    name: "Enrich shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            offset: 0
          - shard: 1
            offset: 1000
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ENRICH_BATCH_SIZE:    ${{ github.event.inputs.batch_size || '1000' }}
      ENRICH_OFFSET:        ${{ matrix.offset }}
      HF_HOME:              /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          # Cache key updated: removed LaBSE (clustering deleted), added summarizer tag
          key: hf-models-deberta-sentiment-v3
          restore-keys: hf-models-deberta-sentiment-
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_md
          python -m spacy download xx_ent_wiki_sm
      - name: Pre-download ML models
        run: |
          python -c "
          from transformers import pipeline
          print('Downloading mDeBERTa (~560 MB)...')
          pipeline('zero-shot-classification', model='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli', device=-1)
          print('Downloading multilingual sentiment (~268 MB)...')
          pipeline('text-classification', model='lxyuan/distilbert-base-multilingual-cased-sentiments-student', device=-1)
          print('All models ready.')
          "
      - name: Run enrichment pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python enrich.py --batch-size $ENRICH_BATCH_SIZE --offset $ENRICH_OFFSET $FORCE_FLAG
