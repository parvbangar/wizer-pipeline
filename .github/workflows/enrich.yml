name: Layer 2 — Metadata Enrichment

# PRIMARY TRIGGER: workflow_run
#   Fires within ~1 minute of any ingestion job completing, so newly ingested
#   articles are enriched almost immediately.
#
# FALLBACK TRIGGER: hourly schedule
#   Catches anything that slipped through.
#
# Three parallel runners. They do NOT split the queue by offset: each one
# CLAIMS its own batch from the work queue
# (wizer_claim_enrichment_batch, FOR UPDATE SKIP LOCKED), so they — and any
# overlapping run from another trigger — never process the same article.
# See docs/enrichment_queue_migration.sql.
on:
  workflow_run:
    workflows:
      - "Ingest — breaking_news (every 1 hour)"
      - "Ingest — multiple_daily (every 3 hours)"
      - "Ingest — daily + unknown (every 12 hours)"
      - "Ingest — weekly (every 24 hours)"
      - "Ingest — several_weekly (every 24 hours)"
      - "Ingest — monthly (every 24 hours)"
    types: [completed]
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles per runner (default: 1000)"
        required: false
        default: "1000"
      force:
        description: "Re-enrich already-enriched articles? (true/false)"
        required: false
        default: "false"

jobs:
  enrich:
    name: "Enrich runner ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # At most one running + one queued job per runner slot. Seven triggers can
    # fire within the same hour; without this, a backlog of identical jobs
    # would pile up and burn Actions minutes claiming an already-drained queue.
    concurrency:
      group: enrich-runner-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # ~5-7 s of CPU per article after the classifier speed-up (was ~16 s, plus
        # DB stalls → 65 s). 3 runners × back-to-back 100-min runs target the
        # ~50K articles/day ingestion rate; check enrichment_queue_health.
        shard: [0, 1, 2]
    env:
      SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
      ENRICH_BATCH_SIZE:          ${{ github.event.inputs.batch_size || '1000' }}
      ENRICH_RUNNER_NAME:         shard-${{ matrix.shard }}
      # Stop starting new articles at 100 min and release the rest, leaving
      # 20 min of the 120-min timeout for the in-flight article + bookkeeping.
      ENRICH_TIME_BUDGET_MINUTES: "100"
      # The claim lease must outlive the job timeout (see enrichment/config.py).
      ENRICH_CLAIM_LEASE_MINUTES: "150"
      # Kill switch without a redeploy: set the repository variable
      # CLUSTERING_ENABLED=false (Settings → Variables). Enrichment continues;
      # articles are saved unclustered and `cluster.py backfill` places them later.
      CLUSTERING_ENABLED:         ${{ vars.CLUSTERING_ENABLED || 'true' }}
      HF_HOME:                    /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          # Bump the suffix whenever the model set changes.
          key: hf-models-deberta-sentiment-e5base-v4
          restore-keys: hf-models-deberta-sentiment-
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Download spaCy models
        run: |
          python -m spacy download en_core_web_md
          python -m spacy download xx_ent_wiki_sm
      - name: Pre-download ML models
        run: |
          python -c "
          from transformers import pipeline
          from sentence_transformers import SentenceTransformer
          from enrichment.config import CLUSTER_EMBEDDING_MODEL
          print('Downloading mDeBERTa (~560 MB)...')
          pipeline('zero-shot-classification', model='MoritzLaurer/mDeBERTa-v3-base-mnli-xnli', device=-1)
          print('Downloading multilingual sentiment (~268 MB)...')
          pipeline('text-classification', model='lxyuan/distilbert-base-multilingual-cased-sentiments-student', device=-1)
          print(f'Downloading clustering embeddings {CLUSTER_EMBEDDING_MODEL} (~1.1 GB)...')
          SentenceTransformer(CLUSTER_EMBEDDING_MODEL, device='cpu')
          print('All models ready.')
          "
      - name: Run enrichment pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python enrich.py --batch-size $ENRICH_BATCH_SIZE $FORCE_FLAG
