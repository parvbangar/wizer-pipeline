name: Coverage audit (daily)

# How complete was yesterday? (tools/coverage_audit.py, docs/COVERAGE.md)
# - every registered news sitemap vs what we stored (publisher ground truth)
# - GDELT's independent sample of Indian URLs: miss rate + capture–recapture
#   estimate of each publisher's true output, and Indian hosts we have no
#   source for
# - per-domain yield, to catch sources that died silently
# Early in the UTC day: sitemaps keep ~48 h, so yesterday is still listed.
# Alerts open (or update) a GitHub issue.
on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST
  workflow_dispatch:
    inputs:
      day:
        description: "Day to audit (YYYY-MM-DD, default yesterday UTC)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt
      - name: Measure coverage
        run: |
          DAY_ARG=""
          if [ -n "${{ github.event.inputs.day }}" ]; then DAY_ARG="--day ${{ github.event.inputs.day }}"; fi
          python tools/coverage_audit.py $DAY_ARG --summary "$GITHUB_STEP_SUMMARY" --alerts alerts.txt
      - name: Open an issue on alerts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s alerts.txt ]; then
            TITLE="Coverage alert $(date -u -d yesterday +%F)"
            if ! gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number -q '.[0].number' | grep -q .; then
              gh issue create -R "$REPO" --title "$TITLE" --body "$(printf 'tools/coverage_audit.py flagged:\n\n'; sed 's/^/- /' alerts.txt)"
            fi
          fi
