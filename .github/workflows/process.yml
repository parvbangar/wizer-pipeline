name: Layer 2 — Process ingested articles

# After every ingest run: cluster in memory, then enrich in parallel shards.
# The runners do the work; the Micro database only receives results in bulk
# (docs/bulk_io_migration.sql).
#
#   cluster  ONE at a time (group story-clustering, shared with cluster.yml and
#            cluster_maintenance.yml): the cached cluster state is the source of
#            truth for live clusters and must have a single writer. Its work
#            list comes from the database — every article still without a
#            cluster — so a superseded pending run loses nothing.
#   plan     counts the hand-off and sizes the fan-out: one enrichment runner
#            per ARTICLES_PER_SHARD articles (1..MAX_SHARDS). A first poll after
#            a reset returns every feed's whole item list — tens of thousands of
#            articles — and must still be enriched WITH the body.
#   enrich   that many runners split the triggering run's hand-off by article
#            id. Articles they do not finish keep enriched_at NULL and are
#            picked up by the sweeper (enrichment.yml).
on:
  workflow_run:
    workflows:
      - "Ingest — official (every 15 min)"
      - "Ingest — breaking_news (every 1 hour)"
      - "Ingest — multiple_daily (every 3 hours)"
      - "Ingest — daily + unknown (every 12 hours)"
      - "Ingest — weekly (every 24 hours)"
      - "Ingest — several_weekly (every 24 hours)"
      - "Ingest — monthly (every 24 hours)"
    types: [completed]
  # Re-process one ingest run's hand-off by hand (e.g. a run whose processing
  # was cancelled): Actions → this workflow → Run workflow → the ingest run id.
  workflow_dispatch:
    inputs:
      ingest_run_id:
        description: "Run id of the ingest workflow whose hand-off to process"
        required: true

permissions:
  contents: read
  actions: read          # download the triggering run's hand-off artifact

env:
  SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  CLUSTERING_ENABLED:   ${{ vars.CLUSTERING_ENABLED || 'true' }}
  HF_HOME:              /home/runner/.cache/huggingface

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.size.outputs.shards }}
      count:  ${{ steps.size.outputs.count }}
    steps:
      - name: Download hand-off
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: handoff
          path: handoff
          run-id: ${{ github.event.workflow_run.id || inputs.ingest_run_id }}
          github-token: ${{ github.token }}
      - name: Size the enrichment fan-out
        id: size
        env:
          ARTICLES_PER_SHARD: "1500"
          MAX_SHARDS: "16"
        run: |
          N=0
          if [ -d handoff ]; then
            N=$(find handoff -name '*.jsonl.gz' -exec zcat {} + | grep -c . || true)
          fi
          S=$(( (N + ARTICLES_PER_SHARD - 1) / ARTICLES_PER_SHARD ))
          [ "$S" -gt "$MAX_SHARDS" ] && S=$MAX_SHARDS
          LIST=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$S")
          echo "Hand-off: $N articles -> $S enrichment shard(s)"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$LIST" >> "$GITHUB_OUTPUT"

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # setup (torch, model) ~10 min + 50-min budget + final flush
    concurrency:
      group: story-clustering
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cluster.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-e5base-v1
      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-cluster.txt
      - name: Download hand-off (bodies for the embedding text)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: handoff
          path: handoff
          run-id: ${{ github.event.workflow_run.id || inputs.ingest_run_id }}
          github-token: ${{ github.token }}
      - name: Restore cluster state
        uses: actions/cache/restore@v4
        with:
          path: state/cluster_state.npz
          key: cluster-state-${{ github.run_id }}
          restore-keys: cluster-state-
      - name: Cluster in memory
        if: env.CLUSTERING_ENABLED != 'false'
        run: |
          BODIES=""
          if [ -d handoff ]; then BODIES="--bodies handoff"; fi
          python cluster.py run --memory --state state/cluster_state.npz $BODIES --hours 72 --time-budget 50
      - name: Save cluster state
        if: success() && env.CLUSTERING_ENABLED != 'false'
        uses: actions/cache/save@v4
        with:
          path: state/cluster_state.npz
          key: cluster-state-${{ github.run_id }}-${{ github.run_attempt }}

  enrich:
    # Does NOT wait for clustering (single writer, often queued behind another
    # run): the story picks up the article's entities in whichever of the two
    # writes comes second (docs/bulk_io_migration.sql §3/§4).
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    name: "Enrich shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 135   # setup ~15 min + 100-min budget + final save; < 150-min claim lease
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ENRICH_RUNNER_NAME: handoff-${{ matrix.shard }}
    steps:
      - name: Download hand-off
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: handoff
          path: handoff
          run-id: ${{ github.event.workflow_run.id || inputs.ingest_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: steps.handoff.outcome == 'success'
        with:
          path: src
      - uses: actions/setup-python@v5
        if: steps.handoff.outcome == 'success'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Cache HuggingFace models
        if: steps.handoff.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-models-deberta-sentiment-e5base-v4
          restore-keys: hf-models-deberta-sentiment-
      - name: Install dependencies
        if: steps.handoff.outcome == 'success'
        working-directory: src
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download en_core_web_md
          python -m spacy download xx_ent_wiki_sm
      - name: Enrich this shard
        if: steps.handoff.outcome == 'success'
        working-directory: src
        run: >
          python enrich.py --handoff ../handoff --shard ${{ matrix.shard }}
          --shards ${{ strategy.job-total }} --time-budget 100
