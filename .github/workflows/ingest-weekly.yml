name: Ingest — weekly (every 24 hours)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-weekly-v2   # renamed 2026-10-03: the old group was held by a ghost run left from the inactivity shutdown
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Poll weekly feeds
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          WIZER_HANDOFF_PATH:     handoff/weekly.jsonl.gz
          INGEST_TIME_BUDGET_MINUTES: "80"
          MAX_CONCURRENT_FEEDS:   "10"
          MAX_CONCURRENT_ARTICLES: "5"
        run: python main.py --cadence weekly

      # Inserted articles WITH their body, for the processing workflow
      # (process.yml: in-memory clustering + sharded enrichment). Uploaded
      # even after a failed poll: whatever was inserted must reach enrichment.
      - name: Upload hand-off
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: handoff/
          retention-days: 7
          if-no-files-found: ignore
