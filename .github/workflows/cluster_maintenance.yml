name: Cluster Maintenance

# ─────────────────────────────────────────────────────────────────────────────
# WHEN DOES THIS RUN?
#   Every Sunday at 04:00 UTC (9:30 IST).
#   Staggered after train_propensity (02:00) to avoid DB contention.
#
# WHAT IT DOES:
#   1. Singleton cleanup: deletes clusters with outlet_count=1, article_count=1
#      that haven't received any new articles in 72 hours.
#      These are local stories that never spread — dead weight in the HNSW index.
#
#   2. Duplicate merge: uses find_duplicate_clusters() pgvector RPC to find
#      clusters with canonical_embedding similarity > 0.87 (separate stories that
#      were clustered independently). Merges smaller into larger, transfers all
#      article cluster_id references, combines outlet_set/entity_set.
#
# WHY WEEKLY:
#   Daily would over-prune singletons that might still get coverage.
#   72-hour TTL + weekly job = singletons live at most 7+3 = 10 days.
#   Duplicate merges accumulate slowly — weekly is frequent enough.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 4 * * 0"   # every Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing (true/false)"
        required: false
        default: "false"
      ttl_hours:
        description: "Singleton TTL in hours (default: 72)"
        required: false
        default: "72"
      merge_threshold:
        description: "Cluster merge similarity threshold (default: 0.87)"
        required: false
        default: "0.87"

jobs:
  maintain:
    name: Cluster maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Run cluster maintenance
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          TTL="${{ github.event.inputs.ttl_hours || '72' }}"
          THRESHOLD="${{ github.event.inputs.merge_threshold || '0.87' }}"
          python cleanup_clusters.py \
            --ttl-hours "$TTL" \
            --merge-threshold "$THRESHOLD" \
            $DRY_FLAG
