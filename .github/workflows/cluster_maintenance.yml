name: Layer 2 — Cluster maintenance

# Every 3 hours (offset from ingestion at :00 and enrichment at :30):
#   1. merge twin story clusters created by order-dependent online assignment
#   2. reconcile cluster counts with their member articles
#   3. prune clusters no article points at any more
# See enrichment/cluster_maintenance.py and docs/CLUSTERING.md.
#
# Pure SQL work driven over the Supabase API — no ML models, so this job
# installs only the light Layer 1 dependency set and finishes in ~1 minute.
on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report planned merges (true/false)"
        required: false
        default: "false"
      lookback_hours:
        description: "Probe clusters touched within this many hours"
        required: false
        default: "6"

# Same group as the in-memory clusterer (process.yml, cluster.yml): merges must
# never overlap it. Their changes reach its cached state through the delta sync.
concurrency:
  group: story-clustering
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt
      - name: Merge / reconcile / prune
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python cluster.py maintain --no-merge --lookback-hours ${{ github.event.inputs.lookback_hours || '6' }} $DRY
      - name: Health report
        if: always()
        run: python cluster.py report --top 15 --runs 6
