name: Article archive

# Daily: move articles older than the hot window (ARCHIVE_HOT_DAYS, default 30)
# from Postgres to Parquet in the private Supabase Storage bucket
# "article-archive" — export, re-download + verify (SHA-256, row counts, ids),
# and only then delete. The SQL delete function refuses any day that is not
# verified, is inside the hot window, or changed since export.
# See archive.py, archiver/runner.py and docs/archive_migration.sql.
#
# Gentle by design: the production database is a Supabase Micro instance whose
# disk I/O the export competes for (on 2026-10-03 a full-speed export starved
# ingestion and clustering). At most 5 days / 120 min per nightly run, so the
# ~60-day backlog drains over ~2 weeks; afterwards each run moves one day.
# Resumable: the next run continues where this one stopped.
on:
  schedule:
    # 21:30 UTC = 03:00 IST, the quietest hour for Indian news (04:30 UTC was
    # 10:00 IST — peak ingestion).
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      no_prune:
        description: "Export + verify only, delete nothing (true/false)"
        required: false
        default: "false"

concurrency:
  group: article-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ARCHIVE_HOT_DAYS:     ${{ vars.ARCHIVE_HOT_DAYS || '30' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-archive.txt
      - run: pip install -r requirements-archive.txt
      - name: Archive → verify → prune
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.no_prune }}" = "true" ]; then FLAGS="--no-prune"; fi
          python archive.py run --time-budget 120 --max-days 5 $FLAGS
      - name: Archive status
        if: always()
        run: python archive.py status --last 10
