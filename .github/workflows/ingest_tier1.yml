name: Ingest — tier1_high (every 1 hour)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-tier1
  cancel-in-progress: false   # finish current run, don't cancel it

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 59        # hard kill if it hangs (shorter than 5min interval)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Debug key length
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: echo "Key length is ${#SUPABASE_SERVICE_KEY} chars"    

      - run: pip install -r requirements.txt

      - name: Poll tier1_high feeds
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python main.py --tier tier1_high
