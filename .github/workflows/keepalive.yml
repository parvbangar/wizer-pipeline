name: Keep scheduled workflows alive

# GitHub DISABLES every scheduled workflow of a repository that has had no
# commit for 60 days ("disabled_inactivity"). That is exactly what stopped this
# pipeline on 2026-06-07: 60 days after the last commit (2026-04-07), all six
# ingestion workflows and enrichment were switched off, and nothing ran for
# four months.
#
# Re-enabling a workflow through the API resets its inactivity timer. This job
# does that weekly for every ACTIVE or inactivity-disabled workflow — including
# itself, so it can never lapse. Workflows paused by hand (disabled_manually)
# are left alone.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable every workflow (resets the 60-day timer)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/workflows" --paginate             --jq '.workflows[] | "\(.id)	\(.state)	\(.name)"' |
          while IFS=$'	' read -r id state name; do
            case "$state" in
              active|disabled_inactivity)
                gh api -X PUT "repos/$REPO/actions/workflows/$id/enable" >/dev/null
                echo "enabled  [$state]  $name" ;;
              *)
                # disabled_manually = an operator paused it on purpose: leave it.
                echo "skipped  [$state]  $name" ;;
            esac
          done
