name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL + pgvector for the SQL integration tests
    # (tests/test_clustering_sql.py, tests/test_migrations_sql.py).
    # pg17 matches Supabase; the image ships pgvector 0.8.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WIZER_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ingest.txt
            requirements-dev.txt

      # Unit tests stub every ML model and network call, so the 2 GB ML stack
      # (torch, transformers, spaCy) is deliberately NOT installed here.
      - name: Install dependencies
        run: pip install -r requirements-ingest.txt -r requirements-dev.txt

      - name: Run tests (unit + SQL integration)
        run: pytest tests/ -v --tb=short
